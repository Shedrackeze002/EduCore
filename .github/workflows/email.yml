name: Set up email

# Forwards admin@gradileo.com to the owner's inbox with Cloudflare Email Routing
# (scripts/cloudflare-email.mjs). It runs when a change to the script (such as a new address in
# ADDRESSES) reaches main, and from the Actions tab. Running it again only adds what is missing. A
# run that adds the inbox waits up to 15 minutes for the link in Cloudflare's verification email to
# be clicked, then creates the addresses.
#
# Repository secrets (docs/SETUP.md, "Email at your domain"):
#   CLOUDFLARE_EMAIL_TOKEN  a token with the Email Routing permissions
#   EMAIL_FORWARD_TO        the inbox; the repository is public, so it stays in a secret
#   CLOUDFLARE_API_TOKEN    the deploy token, which finds the domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cloudflare-email.mjs
      - .github/workflows/email.yml

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Email Routing
        # A copy of the repository without the email secrets skips the automatic run; a manual run
        # says which secrets are missing.
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ -z "$CLOUDFLARE_EMAIL_TOKEN" ] || [ -z "$EMAIL_FORWARD_TO" ]; }; then
            echo "The email secrets are not set; skipping."
            exit 0
          fi
          node scripts/cloudflare-email.mjs
        env:
          CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL_FORWARD_TO: ${{ secrets.EMAIL_FORWARD_TO }}
