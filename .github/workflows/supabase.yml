name: Deploy Supabase backend

# Applies database migrations and deploys the Edge Functions.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID     the project reference (the "abcd…" part of https://abcd….supabase.co)
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was created
#
# Function secrets (MINIMAX_API_KEY, RESEND_API_KEY, …) are set once with
# `supabase secrets set`, see docs/SETUP.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'engine/**'
  # Merges made through an app do not start push workflows (see deploy.yml), so a merged pull
  # request into main deploys too. The job checks out main, never the pull request's own code.
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'supabase/**'
      - 'engine/**'

jobs:
  deploy:
    # A closed pull request deploys only when it was merged.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Supabase secrets are not set; skipping backend deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.ref }}
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.skip != 'true'
        with:
          version: latest
      - name: Apply migrations
        if: steps.cfg.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$PROJECT_ID"
          supabase db push
      - name: Deploy functions
        if: steps.cfg.outputs.skip != 'true'
        run: |
          node scripts/sync-engine.mjs
          supabase functions deploy grade-submission ai-agent create-students send-emails admin-users --project-ref "$PROJECT_ID"
