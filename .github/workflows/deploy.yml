name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Variables (optional)
#     VITE_SUPABASE_URL       Supabase project URL; overrides .env.production when set
#     VITE_SUPABASE_ANON_KEY  the project's anon / publishable key (safe to expose)
#     CUSTOM_DOMAIN           e.g. learn.yourschool.ca, once you have a domain
#     BASE_PATH               override the base path (defaults to /<repo>/, or / with a custom domain)
#
# Then set Settings → Pages → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  # Merges made through an app (such as Claude's GitHub connection) do not start push workflows,
  # so a merged pull request into main deploys too. pull_request_target runs this workflow as it
  # is on main and the build checks out main, never the pull request's own code.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A closed pull request deploys only when it was merged.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Repository variables override .env.production only when they are set. They are
      # written to .env.production.local rather than passed as environment variables,
      # because an unset variable arrives as an empty string and would blank the backend.
      - name: Choose the backend
        run: |
          : > .env.production.local
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> .env.production.local; fi
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production.local; fi
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || (vars.CUSTOM_DOMAIN && '/') || format('/{0}/', github.event.repository.name) }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Check the site is connected to its backend
        run: node scripts/check-backend.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
